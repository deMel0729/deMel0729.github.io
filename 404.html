<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Malan de Mel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>
  try {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>
<style>
  .notfound {
    min-height: 100vh;
    display: grid;
    place-content: center;
    text-align: center;
    gap: 6px;
  }
  .notfound h1 { font-size: clamp(3rem, 12vw, 5rem); letter-spacing: -.05em; }
  .notfound p  { color: var(--muted); margin-bottom: 22px; }
</style>
</head>
<body>
  <main class="notfound wrap">
    <p class="mono" style="color: var(--accent)">404</p>
    <h1>Not found</h1>
    <p>That page does not exist — or it did once and no longer does.</p>
    <p><a class="btn btn-primary" href="/">Back to the homepage</a></p>
  </main>
</body>
</html>
